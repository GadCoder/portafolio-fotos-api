version: '3.8'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - dokploy-network

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      APP_USER: ${APP_USER:?Set APP_USER}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:?Set APP_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      IMAGE_MAX_PIXELS: ${IMAGE_MAX_PIXELS:-80000000}
      s3_key: ${s3_key:?Set s3_key}
      s3_secret_key: ${s3_secret_key:?Set s3_secret_key}
      s3_endpoint: ${s3_endpoint:?Set s3_endpoint}
      s3_bucket_name: ${s3_bucket_name:?Set s3_bucket_name}
      s3_url: ${s3_url:?Set s3_url}
    networks:
      - dokploy-network

volumes:
  pg_data:

networks:
  dokploy-network:
    external: true
